# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app_url: '%env(default::APP_URL)%'
    mailer_from_address: '%env(MAILER_FROM_ADDRESS)%'
    mailer_from_name: '%env(MAILER_FROM_NAME)%'
    holiday_country_default: 'TN'
    holiday_country: '%env(default:holiday_country_default:HOLIDAY_COUNTRY)%'
    holiday_api_base: 'https://date.nager.at/api/v3'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe_webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
         resource: '../src/*'
         exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    App\EventSubscriber\RouterContextSubscriber:
        arguments:
            $appUrl: '%app_url%'

    App\EventSubscriber\DoctrineSanitizeSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    App\Service\StripePaymentService:
        arguments:
            $stripeSecretKey: '%stripe_secret_key%'
            $stripePublicKey: '%stripe_public_key%'
            $stripeWebhookSecret: '%stripe_webhook_secret%'

    App\Service\GeoLocationService:
        arguments:
            $environment: '%kernel.environment%'

    App\Service\AIDataCleanerService:
        arguments:
            $openaiApiKey: '%env(OPENAI_API_KEY)%'

    App\Service\PdfGeneratorService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ProductRecommendationService:
        arguments:
            $openaiApiKey: '%env(OPENAI_API_KEY)%'

    App\Service\DrugCompatibilityService:
        arguments:
            $openaiApiKey: '%env(OPENAI_API_KEY)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
