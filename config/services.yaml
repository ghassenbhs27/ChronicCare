# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app_url: '%env(default::APP_URL)%'
    mailer_from_address: '%env(MAILER_FROM_ADDRESS)%'
    mailer_from_name: '%env(MAILER_FROM_NAME)%'
    holiday_country_default: 'TN'
    holiday_country: '%env(default:holiday_country_default:HOLIDAY_COUNTRY)%'
    holiday_api_base: 'https://date.nager.at/api/v3'
    weather_default_country: 'TN'
    weather_geocoding_api_base: 'https://geocoding-api.open-meteo.com/v1'
    weather_forecast_api_base: 'https://api.open-meteo.com/v1/forecast'
    weather_archive_api_base: 'https://archive-api.open-meteo.com/v1/archive'
    map_geocode_api_base: 'https://nominatim.openstreetmap.org'
    ai_api_base_default: 'https://api.openai.com/v1'
    ai_api_base: '%env(default:ai_api_base_default:AI_API_BASE)%'
    ai_model_default: 'gpt-4o-mini'
    ai_model: '%env(default:ai_model_default:AI_MODEL)%'
    ai_api_key_default: ''
    ai_api_key: '%env(default:ai_api_key_default:AI_API_KEY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
         resource: '../src/*'
         exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    App\EventSubscriber\RouterContextSubscriber:
        arguments:
            $appUrl: '%app_url%'

    App\EventSubscriber\DoctrineSanitizeSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
